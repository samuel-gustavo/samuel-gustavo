name: generate animation

on:
  # executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"

  # permite executar manualmente
  workflow_dispatch:

  # executa quando houver push na branch master
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # gera a animação da cobrinha
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |

            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%238B5CF6,%236D28D9

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%23161B22,%233B0764,%236D28D9,%238B5CF6,%23C084FC


      # envia os arquivos para a branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
