name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: samuel-gustavo

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%238B5CF6,%236D28D9

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots=%23161B22,%233B0764,%236D28D9,%238B5CF6,%23C084FC

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
          commit_message: "chore: update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
